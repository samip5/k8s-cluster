---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name siloserver
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Master key for at-rest credential encryption (openssl rand -base64 48).
        # Losing it makes every encrypted secret unrecoverable; back it up separately.
        SECRET_KEY: "{{ .SECRET_KEY }}"
        DATABASE_URL: "postgres://{{ .SILO_POSTGRES_USER }}:{{ urlquery .SILO_POSTGRES_PASSWORD }}@192.168.2.2:55432/silo_media?sslmode=disable"
        # Role, database and extensions were created by hand on the NAS Postgres 18
  dataFrom:
    - extract:
        key: siloserver
