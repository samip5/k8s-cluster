---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name siloserver
  namespace: media
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Master key for at-rest credential encryption (openssl rand -base64 48).
        # Losing it makes every encrypted secret unrecoverable; back it up separately.
        SECRET_KEY: "{{ .SECRET_KEY }}"
        DATABASE_URL: "postgres://{{ .SILO_POSTGRES_USER }}:{{ urlquery .SILO_POSTGRES_PASSWORD }}@postgres16-rw.databases.svc.cluster.local:5432/silo_media?sslmode=disable"
        # Postgres Init
        INIT_POSTGRES_DBNAME: silo_media
        INIT_POSTGRES_HOST: postgres16-rw.databases.svc.cluster.local
        INIT_POSTGRES_USER: "{{ .SILO_POSTGRES_USER }}"
        INIT_POSTGRES_PASS: "{{ .SILO_POSTGRES_PASSWORD }}"
        INIT_POSTGRES_SUPER_USER: "{{ .POSTGRES_SUPER_USER }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: siloserver
    - extract:
        key: cloudnative-pg
