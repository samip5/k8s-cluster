apiVersion: v1
kind: ConfigMap
metadata:
  name: index-config
data:
  Caddyfile: |
        {
        servers {
            trusted_proxies static 192.168.2.2/32
        }
    }
    http://dh.media.skylab.fi {
      log {
        output stdout
        format json
      }

      root * /share
    
      file_server browse
    }
    
    http://dh.dock.skylab.fi {
      log {
        output stdout
        format json
      }
    
      root * /share
      file_server browse
    }
    
    http://dh.skylab.fi {
      log {
        output stdout
        format json
      }
      root * /share
      file_server browse
    }
