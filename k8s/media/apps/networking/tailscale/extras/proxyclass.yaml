apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: tun-access
spec:
  statefulSet:
    pod:
      tailscaleContainer:
        # /dev/net/tun is injected by generic-device-plugin (kube-system).
        # Without it containerboot tries to mknod the device, which needs
        # CAP_MKNOD and fails with "operation not permitted".
        resources:
          limits:
            kernel.org/tun: "1"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
            add:
              - NET_ADMIN
