---
name: "Flux Image Test"

on:
  pull_request:
    branches: ["main"]
    paths: ["k8s/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-images:
    name: Extract Images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extract-images.outputs.images }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: "${{ steps.app-token.outputs.token }}"
          fetch-depth: 0

      - name: Get Changed Clusters
        id: changed-clusters
        uses: tj-actions/changed-files@v47
        with:
          files: k8s/**
          files_ignore: k8s/base/**
          dir_names: true
          dir_names_max_depth: 2
          matrix: true

      - name: Setup flate
        uses: home-operations/flate/action@v0.7.3
        with:
          base: "origin/${{ github.event.repository.default_branch }}"
          cache: "true"

      # `flate diff images` prints only images that are new compared to the
      # base branch, one per line. Render failures are reported by Flux Diff,
      # so here they only produce a warning.
      - name: Gather New Images
        id: extract-images
        env:
          CHANGED: ${{ steps.changed-clusters.outputs.all_changed_and_modified_files }}
        run: |
          : > images.txt
          for dir in $(jq -r '.[]' <<< "${CHANGED:-[]}"); do
            [[ -d "${dir}/flux" ]] || continue
            echo "::group::${dir}"
            if ! flate diff images --path "${dir}/flux" --no-progress >> images.txt; then
              echo "::warning::flate could not render every resource in ${dir}; see the Flux Diff workflow"
            fi
            echo "::endgroup::"
          done

          images=$(grep -v '^\s*$' images.txt | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=${images}" >> "$GITHUB_OUTPUT"
          echo "${images}"
          {
            echo "### Images"
            jq -r '.[] | "* `\(.)`"' <<< "${images}"
          } >> "$GITHUB_STEP_SUMMARY"

  test-images:
    if: ${{ needs.extract-images.outputs.matrix != '[]' }}
    name: Test images
    runs-on: ubuntu-latest
    needs: ["extract-images"]
    strategy:
      matrix:
        images: ${{ fromJSON(needs.extract-images.outputs.matrix) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Inspect Image
        env:
          IMAGE: ${{ matrix.images }}
        run: docker buildx imagetools inspect "${IMAGE}"

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  test-images-success:
    if: ${{ always() }}
    needs: ["test-images"]
    name: Test Images Successful
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check matrix status
        run: exit 1
