---
name: "Flux Diff"

on:
  pull_request:
    branches: ["main"]
    paths: ["k8s/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed-clusters:
    name: Changed Clusters
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.clusters.outputs.matrix }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout Default Branch
        uses: actions/checkout@v7
        with:
          token: "${{ steps.app-token.outputs.token }}"
          fetch-depth: 0

      - name: Get Changed Clusters
        id: changed-clusters
        uses: tj-actions/changed-files@v47
        with:
          files: k8s/**
          files_ignore: k8s/base/**
          dir_names: true
          dir_names_max_depth: 2
          matrix: true

      # Only directories with a Flux entrypoint (<cluster>/flux) can be rendered
      - name: Filter Flux Clusters
        id: clusters
        env:
          CHANGED: ${{ steps.changed-clusters.outputs.all_changed_and_modified_files }}
        run: |
          matrix=$(jq -c '[.[] | select(. != "")] | unique' <<< "${CHANGED:-[]}" \
            | jq -r '.[]' \
            | while read -r dir; do [[ -d "${dir}/flux" ]] && echo "${dir}"; done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}"

  flux-diff:
    if: ${{ needs.changed-clusters.outputs.matrix != '[]' }}
    name: Flux Diff
    runs-on: ubuntu-latest
    needs: ["changed-clusters"]
    permissions:
      pull-requests: write
    strategy:
      matrix:
        paths: ${{ fromJSON(needs.changed-clusters.outputs.matrix) }}
      max-parallel: 4
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: "${{ steps.app-token.outputs.token }}"
          fetch-depth: 0

      - name: Setup flate
        uses: home-operations/flate/action@v0.6.5
        with:
          base: "origin/${{ github.event.repository.default_branch }}"
          cache: "true"

      # flate exits 1 on render failures (on either side) but still prints the
      # diff it could produce, so capture the status instead of failing here.
      - name: Diff Resources
        id: diff
        env:
          CLUSTER_PATH: ${{ matrix.paths }}
        run: |
          set +e
          flate diff all \
            --path "${CLUSTER_PATH}/flux" \
            --output github \
            --no-progress \
            > diff.patch 2> diff.err
          status=$?
          set -e

          cat diff.err >&2
          cat diff.patch

          # Keep the PR comment well under GitHub's 65536 character limit
          if [[ $(wc -c < diff.patch) -gt 60000 ]]; then
            head -c 60000 diff.patch > diff.trunc
            printf '\n... diff truncated, see the job summary for the full output\n' >> diff.trunc
          else
            cp diff.patch diff.trunc
          fi

          {
            if [[ -s diff.trunc ]]; then
              echo '```diff'
              cat diff.trunc
              echo '```'
            fi
            if [[ "${status}" != "0" ]]; then
              echo
              echo '> [!CAUTION]'
              echo '> flate failed to render some resources (on this PR or on the base branch):'
              echo
              echo '```'
              head -c 4000 diff.err
              echo '```'
            fi
          } > comment.md

          {
            echo "status=${status}"
            echo 'comment<<FLATE_EOF'
            cat comment.md
            echo FLATE_EOF
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Diff (${CLUSTER_PATH})"
            echo '```diff'
            cat diff.patch
            echo '```'
            if [[ -s diff.err ]]; then
              echo "### Errors"
              echo '```'
              cat diff.err
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - if: ${{ steps.diff.outputs.comment != '' }}
        name: Add comment
        uses: mshick/add-pr-comment@v3
        with:
          repo-token: "${{ steps.app-token.outputs.token }}"
          message-id: "${{ github.event.pull_request.number }}/${{ matrix.paths }}"
          message-failure: Diff was not successful
          message: |
            ### Flux diff: `${{ matrix.paths }}`

            ${{ steps.diff.outputs.comment }}

      # Gate only on the PR side: render errors that already exist on the base
      # branch show up in the diff comment but must not block a PR fixing them.
      - name: Test Render
        env:
          CLUSTER_PATH: ${{ matrix.paths }}
        run: flate test all --path "${CLUSTER_PATH}/flux" --no-progress

  # Summarize matrix https://github.community/t/status-check-for-a-matrix-jobs/127354/7
  flux-diff-success:
    if: ${{ always() }}
    needs: ["flux-diff"]
    name: Flux Diff Successful
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        name: Check matrix status
        run: exit 1
